<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARKOP — Ngopi. Ngumpul. Ngepoin Poin.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        .hidden { display: none !important; }
        :root { color-scheme: light; }
        html { overflow-x: hidden; scroll-behavior: smooth; }
        body { background: #FFF8EC; color: #1C130E; font-family: "Manrope", sans-serif; overflow-x: hidden; }
        #appContent, #appContent > * { min-width: 0; }
        img, canvas, svg { max-width: 100%; }
        input, select, button { max-width: 100%; }
        .font-mono { font-family: "DM Mono", monospace; }
        .font-display { font-family: "Instrument Serif", serif; }
        button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #D96C33; outline-offset: 2px; }
        @media (prefers-reduced-motion: no-preference) { button { transition: transform .18s ease, background-color .18s ease, color .18s ease; } button:hover { transform: translateY(-1px); } }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans">
    <header id="siteHeader" class="sticky top-0 z-50 border-b border-[#1C130E]/10 bg-[#FFF8EC]/90 backdrop-blur-md">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
            <a href="#" id="brandHome" class="flex items-center gap-2.5 shrink-0">
                <span class="flex h-9 w-9 items-center justify-center rounded-full bg-[#1C130E] text-[#FFF8EC]"><i class="fa-solid fa-mug-hot text-sm"></i></span>
                <span class="text-[20px] font-black tracking-[0.12em] text-[#1C130E]">WARKOP</span>
                <span class="hidden sm:inline-flex rounded-full border border-[#1C130E]/15 bg-white px-2 py-0.5 text-[10px] font-bold tracking-widest text-[#1C130E]/60">NGOPI DULU</span>
            </a>
            <nav class="hidden md:flex items-center gap-1 text-sm font-bold">
                <button data-nav="home" class="nav-link rounded-full bg-[#1C130E] px-4 py-2 text-[#FFF8EC]">Home</button>
                <button data-nav="menu" class="nav-link rounded-full px-4 py-2 text-[#1C130E]/70 hover:bg-white hover:text-[#1C130E]">Menu</button>
                <button data-nav="auth" class="nav-link rounded-full px-4 py-2 text-[#1C130E]/70 hover:bg-white hover:text-[#1C130E]">Member</button>
            </nav>
            <div class="flex items-center gap-2">
                <div id="navUserBox" class="hidden items-center gap-2 rounded-full border border-[#1C130E]/10 bg-white px-2 py-1 pr-3">
                    <span id="userRoleBadge" class="rounded-full bg-[#D96C33] px-2 py-1 text-[10px] font-black tracking-widest text-white uppercase">ROLE</span>
                    <div class="hidden sm:block text-left leading-tight"><p id="navUserName" class="truncate max-w-[120px] text-xs font-bold text-[#1C130E]">User</p><p id="navUserEmail" class="truncate max-w-[120px] text-[11px] text-[#1C130E]/50">mail</p></div>
                </div>
                <button id="btnHeaderAuth" class="rounded-full bg-[#1C130E] px-5 py-2.5 text-sm font-bold text-[#FFF8EC] hover:bg-black">Masuk</button>
                <button id="btnLogout" class="hidden shrink-0 rounded-full border border-[#1C130E]/15 bg-white px-4 py-2.5 text-sm font-bold text-[#1C130E] hover:bg-[#FFEED2]"><i class="fa-solid fa-right-from-bracket mr-1"></i> Keluar</button>
                <button id="btnMobileNav" class="md:hidden rounded-full border border-[#1C130E]/10 bg-white p-2.5 text-[#1C130E]"><i class="fa-solid fa-bars"></i></button>
            </div>
        </div>
        <div id="mobileNav" class="hidden md:hidden border-t border-[#1C130E]/10 bg-[#FFF8EC] px-4 py-3 flex flex-col gap-1">
            <button data-nav="home" class="nav-link text-left rounded-xl bg-[#1C130E] px-4 py-3 font-bold text-[#FFF8EC]">Home</button>
            <button data-nav="menu" class="nav-link text-left rounded-xl px-4 py-3 font-bold text-[#1C130E]">Menu</button>
            <button data-nav="auth" class="nav-link text-left rounded-xl px-4 py-3 font-bold text-[#1C130E]">Member / Login</button>
        </div>
    </header>
    <nav id="topNavbar" class="hidden"></nav>
    <main id="appContent" class="flex-1 p-4 md:p-6 max-w-7xl mx-auto w-full"></main>
    <footer class="border-t border-[#1C130E]/10 bg-[#1C130E] text-[#FFF8EC]/70">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 py-8 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
            <div class="flex items-center gap-2"><span class="flex h-8 w-8 items-center justify-center rounded-full bg-[#FFF8EC] text-[#1C130E]"><i class="fa-solid fa-mug-hot text-xs"></i></span><span class="font-black tracking-[0.16em] text-[#FFF8EC]">WARKOP</span><span class="text-xs">— Ngopi dulu, urusan poin belakangan.</span></div>
            <p class="text-xs">Buka 07.00–23.00 · Jl. Nongkrong No. 8 · © WARKOP 2026</p>
        </div>
    </footer>
    <script type="module" src="assets/js/component-loader.js"></script>
</body>
</html>
