<div id="authContainer" class="max-w-md mx-auto my-12 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
    <div class="flex border-b border-slate-800 mb-6">
        <button id="tabLogin" class="flex-1 py-2 text-center font-bold text-emerald-400 border-b-2 border-emerald-400">Login</button>
        <button id="tabRegister" class="flex-1 py-2 text-center font-bold text-slate-400 hover:text-white">Register Member</button>
    </div>
    <form id="formLogin" class="space-y-4">
        <div><label class="block text-xs font-medium text-slate-400 mb-1">Email</label><input type="email" id="loginEmail" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:border-emerald-500 outline-none"></div>
        <div><label class="block text-xs font-medium text-slate-400 mb-1">Password</label><input type="password" id="loginPassword" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:border-emerald-500 outline-none"></div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg transition-all shadow-lg shadow-emerald-900/40">Masuk Aplikasi</button>
    </form>
    <form id="formRegister" class="space-y-4 hidden">
        <div><label class="block text-xs font-medium text-slate-400 mb-1">Nama Lengkap</label><input type="text" id="regName" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:border-emerald-500 outline-none"></div>
        <div><label class="block text-xs font-medium text-slate-400 mb-1">Email</label><input type="email" id="regEmail" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:border-emerald-500 outline-none"></div>
        <div><label class="block text-xs font-medium text-slate-400 mb-1">Password</label><input type="password" id="regPassword" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:border-emerald-500 outline-none"></div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg transition-all shadow-lg shadow-emerald-900/40">Daftar &amp; Terbitkan Kartu</button>
    </form>
</div>
