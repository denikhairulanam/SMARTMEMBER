<div id="authContainer" class="hidden max-w-md mx-auto my-8 bg-white border border-[#2a1a0e]/10 rounded-[28px] p-6 sm:p-8 shadow-2xl relative overflow-hidden">
    <div class="absolute top-0 inset-x-0 h-2 bg-[#D96C33]"></div>
    <div class="text-center mb-6">
        <span class="inline-flex h-12 w-12 items-center justify-center rounded-full bg-[#1C130E] text-[#FFF8EC] text-xl mb-2"><i class="fa-solid fa-mug-hot"></i></span>
        <h2 class="text-2xl font-black text-[#1C130E]" style="font-family:'Instrument Serif', serif;">WARKOP MEMBER</h2>
        <p class="text-xs text-[#1C130E]/60 mt-0.5">Masuk akun atau mendaftar member baru</p>
    </div>
    <div class="flex border-b border-[#1C130E]/10 mb-6 text-sm">
        <button id="tabLogin" class="flex-1 py-2.5 text-center font-bold text-[#1C130E] border-b-2 border-[#D96C33]">Login Warkop</button>
        <button id="tabRegister" class="flex-1 py-2.5 text-center font-bold text-[#1C130E]/50 hover:text-[#1C130E]">Daftar Member</button>
    </div>
    <form id="formLogin" class="space-y-4">
        <div><label class="block text-xs font-bold uppercase tracking-wider text-[#1C130E]/70 mb-1">Email</label><input type="email" id="loginEmail" required placeholder="email@kamu.com" class="w-full bg-[#FFF8EC] border border-[#1C130E]/15 rounded-xl px-4 py-2.5 text-[#1C130E] focus:border-[#D96C33] outline-none text-sm"></div>
        <div><label class="block text-xs font-bold uppercase tracking-wider text-[#1C130E]/70 mb-1">Password</label><input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-[#FFF8EC] border border-[#1C130E]/15 rounded-xl px-4 py-2.5 text-[#1C130E] focus:border-[#D96C33] outline-none text-sm"></div>
        <button type="submit" class="w-full bg-[#1C130E] hover:bg-black text-[#FFF8EC] font-bold py-3 rounded-xl transition-all shadow-lg text-sm"><i class="fa-solid fa-right-to-bracket mr-2"></i> Masuk Aplikasi</button>
    </form>
    <form id="formRegister" class="space-y-4 hidden">
        <div><label class="block text-xs font-bold uppercase tracking-wider text-[#1C130E]/70 mb-1">Nama Lengkap / Panggilan</label><input type="text" id="regName" required placeholder="Contoh: Budi Nongkrong" class="w-full bg-[#FFF8EC] border border-[#1C130E]/15 rounded-xl px-4 py-2.5 text-[#1C130E] focus:border-[#D96C33] outline-none text-sm"></div>
        <div><label class="block text-xs font-bold uppercase tracking-wider text-[#1C130E]/70 mb-1">Email Aktif</label><input type="email" id="regEmail" required placeholder="email@kamu.com" class="w-full bg-[#FFF8EC] border border-[#1C130E]/15 rounded-xl px-4 py-2.5 text-[#1C130E] focus:border-[#D96C33] outline-none text-sm"></div>
        <div><label class="block text-xs font-bold uppercase tracking-wider text-[#1C130E]/70 mb-1">Password (min 6 karakter)</label><input type="password" id="regPassword" required minlength="6" placeholder="••••••••" class="w-full bg-[#FFF8EC] border border-[#1C130E]/15 rounded-xl px-4 py-2.5 text-[#1C130E] focus:border-[#D96C33] outline-none text-sm"></div>
        <button type="submit" class="w-full bg-[#D96C33] hover:bg-[#b85520] text-white font-bold py-3 rounded-xl transition-all shadow-lg text-sm"><i class="fa-solid fa-id-card mr-2"></i> Daftar &amp; Dapet 100 Poin</button>
    </form>
</div>
